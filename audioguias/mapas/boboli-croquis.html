<!doctype html>
<html><head><meta charset="utf-8"><title>Jardín de Boboli</title>
<style>
body{margin:0;background:#fbf7ee}
svg{display:block}
.t{font-family:"DejaVu Serif",Georgia,serif;font-weight:bold;fill:#3b2a1a}
.s{font-family:"DejaVu Sans",Arial,sans-serif;fill:#3b2a1a}
</style></head><body>
<svg width="1080" height="2060" viewBox="0 0 1080 2060" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
 <marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9776b"/></marker>
 <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#d3e3b5"/><circle cx="8" cy="9" r="3" fill="#bcd394"/><circle cx="22" cy="22" r="3" fill="#bcd394"/></pattern>
 <pattern id="stone" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#ece5d6"/><path d="M0,24 L24,0" stroke="#d9cfba" stroke-width="2"/></pattern>
 <pattern id="hedge" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#c4dba0"/><rect x="4" y="4" width="32" height="32" fill="none" stroke="#7d9a55" stroke-width="3"/></pattern>
</defs>

<text x="540" y="62" text-anchor="middle" class="t" font-size="48">JARDÍN DE BOBOLI</text>
<text x="540" y="102" text-anchor="middle" class="s" font-size="24">Recorrido de 1 h · se entra por el fondo del patio del palacio</text>

<!-- Fondo jardín -->
<rect x="30" y="130" width="1020" height="1050" rx="24" fill="url(#grass)" stroke="#7d9a55" stroke-width="3"/>
<text x="1020" y="170" text-anchor="end" class="s" font-size="20" font-style="italic">↑ hacia arriba = cuesta arriba</text>

<!-- Viottolone opcional -->
<path d="M720,820 L990,330" stroke="#8a7a60" stroke-width="5" stroke-dasharray="6 10" fill="none"/>
<g fill="#4f6b2c"><circle cx="760" cy="760" r="9"/><circle cx="800" cy="688" r="9"/><circle cx="840" cy="615" r="9"/><circle cx="880" cy="543" r="9"/><circle cx="920" cy="470" r="9"/><circle cx="955" cy="398" r="9"/></g>
<text transform="translate(905,640) rotate(-61)" text-anchor="middle" class="s" font-size="19">Viottolone (cipreses)</text>
<ellipse cx="960" cy="270" rx="70" ry="40" fill="#a9d1e8" stroke="#4a7c99" stroke-width="3"/>
<ellipse cx="960" cy="270" rx="24" ry="14" fill="#d3e3b5" stroke="#4a7c99" stroke-width="2"/>
<text x="960" y="215" text-anchor="middle" class="s" font-size="19" font-weight="bold">Isolotto</text>
<text x="960" y="340" text-anchor="middle" class="s" font-size="17">(opcional, +30 min)</text>

<!-- Jardín del Caballero -->
<rect x="110" y="230" width="270" height="170" fill="url(#hedge)" stroke="#5a4128" stroke-width="3"/>
<rect x="120" y="240" width="250" height="56" fill="#fbf7ee" opacity="0.85"/>
<text x="245" y="265" text-anchor="middle" class="t" font-size="21">JARDÍN DEL</text>
<text x="245" y="290" text-anchor="middle" class="t" font-size="21">CABALLERO</text>
<text x="245" y="425" text-anchor="middle" class="s" font-size="18">rosales · vista al campo</text>

<!-- Abundancia -->
<rect x="522" y="380" width="36" height="20" fill="#9c8f7a"/>
<circle cx="540" cy="362" r="18" fill="#cfc6b4" stroke="#5a4128" stroke-width="3"/>
<text x="600" y="360" class="t" font-size="21">ESTATUA DE LA</text>
<text x="600" y="385" class="t" font-size="21">ABUNDANCIA</text>
<text x="600" y="410" class="s" font-size="18">vista a Florencia</text>

<!-- Neptuno -->
<ellipse cx="540" cy="610" rx="105" ry="50" fill="#a9d1e8" stroke="#4a7c99" stroke-width="3"/>
<circle cx="540" cy="610" r="10" fill="#7a6a50"/>
<text x="670" y="605" class="t" font-size="21">FUENTE DE</text>
<text x="670" y="630" class="t" font-size="21">NEPTUNO</text>

<!-- Subida -->
<text x="700" y="500" class="s" font-size="18" font-style="italic" fill="#7a3b1a">subida empinada</text>
<text x="700" y="522" class="s" font-size="18" font-style="italic" fill="#7a3b1a">con ripio</text>

<!-- Anfiteatro -->
<path d="M360,1010 L360,880 A180,170 0 0 1 720,880 L720,1010" fill="none" stroke="#9fbf6e" stroke-width="44"/>
<path d="M360,1010 L360,880 A180,170 0 0 1 720,880 L720,1010" fill="none" stroke="#7d9a55" stroke-width="2" stroke-dasharray="3 7"/>
<rect x="392" y="870" width="296" height="140" fill="#efe6cf"/>
<path d="M540,700 L540,700" />
<polygon points="540,820 548,900 532,900" fill="#9c8f7a" stroke="#5a4128" stroke-width="2"/>
<ellipse cx="540" cy="940" rx="34" ry="12" fill="#b9b2a5" stroke="#5a4128" stroke-width="2"/>
<text x="540" y="985" text-anchor="middle" class="t" font-size="24">ANFITEATRO</text>
<text x="420" y="890" class="s" font-size="17">obelisco</text>
<text x="420" y="910" class="s" font-size="17">egipcio</text>

<!-- Terraza Carciofo -->
<rect x="440" y="1035" width="200" height="70" fill="url(#stone)" stroke="#8a7a60" stroke-width="2"/>
<circle cx="540" cy="1070" r="20" fill="#a9d1e8" stroke="#4a7c99" stroke-width="3"/>
<text x="660" y="1065" class="s" font-size="18" font-weight="bold">Terraza del</text>
<text x="660" y="1087" class="s" font-size="18" font-weight="bold">Carciofo</text>

<!-- Gruta y Bacco -->
<path d="M70,1080 Q90,1010 150,1015 Q215,1005 230,1070 L230,1140 L70,1140 z" fill="#c9b994" stroke="#5a4128" stroke-width="3"/>
<path d="M95,1140 Q150,1060 205,1140" fill="#6b5a44"/>
<text x="150" y="990" text-anchor="middle" class="t" font-size="19">GRUTA DE</text>
<text x="150" y="1013" text-anchor="middle" class="t" font-size="19" dy="-0">BUONTALENTI</text>
<circle cx="300" cy="1120" r="13" fill="#cfc6b4" stroke="#5a4128" stroke-width="2"/>
<text x="300" y="1080" text-anchor="middle" class="s" font-size="17" font-weight="bold">Bacco</text>

<!-- Palacio -->
<path d="M60,1190 L1020,1190 L1020,1300 L60,1300 z" fill="#f1e4c8" stroke="#5a4128" stroke-width="3"/>
<rect x="430" y="1190" width="220" height="70" fill="url(#stone)" stroke="#8a7a60" stroke-width="2"/>
<text x="540" y="1232" text-anchor="middle" class="s" font-size="20" font-weight="bold">PATIO</text>
<text x="270" y="1255" text-anchor="middle" class="t" font-size="30">PALAZZO</text>
<text x="820" y="1255" text-anchor="middle" class="t" font-size="30">PITTI</text>
<text x="540" y="1340" text-anchor="middle" class="s" font-size="20">↓ Piazza Pitti y la ciudad</text>
<path d="M60,1150 L30,1180" stroke="#5a4128" stroke-width="3"/>
<text x="70" y="1175" class="s" font-size="16">salida a la plaza</text>
<rect x="490" y="1268" width="100" height="30" rx="6" fill="#2e7d32"/>
<text x="540" y="1290" text-anchor="middle" class="s" font-size="19" font-weight="bold" fill="#fff">INICIO</text>

<!-- Recorrido ida -->
<path d="M540,1190 L540,1100 L540,1000 L540,900 L540,770 L540,662 L540,520 L540,402 L470,370 L380,330"
 fill="none" stroke="#c0392b" stroke-width="7" stroke-dasharray="16 9" stroke-linejoin="round" marker-mid="url(#ar)" marker-end="url(#ar)"/>
<!-- Vuelta -->
<path d="M200,400 L200,560 L230,720 L260,880 L250,1000 L270,1100 L360,1150 L430,1210"
 fill="none" stroke="#d9776b" stroke-width="6" stroke-dasharray="10 9" stroke-linejoin="round" marker-mid="url(#ar2)" marker-end="url(#ar2)"/>
<text transform="translate(195,760) rotate(-84)" text-anchor="middle" class="s" font-size="18" font-style="italic">bajada / vuelta al palacio</text>

<!-- Números -->
<g class="s" font-size="24" font-weight="bold" text-anchor="middle">
 <circle cx="490" cy="1070" r="20" fill="#1d1d1d"/><text x="490" y="1079" fill="#fff">1</text>
 <circle cx="480" cy="940" r="20" fill="#1d1d1d"/><text x="480" y="949" fill="#fff">2</text>
 <circle cx="420" cy="610" r="20" fill="#1d1d1d"/><text x="420" y="619" fill="#fff">3</text>
 <circle cx="490" cy="350" r="20" fill="#1d1d1d"/><text x="490" y="359" fill="#fff">4</text>
 <circle cx="140" cy="350" r="20" fill="#1d1d1d"/><text x="140" y="359" fill="#fff">5</text>
 <circle cx="150" cy="1080" r="20" fill="#1d1d1d"/><text x="150" y="1089" fill="#fff">6</text>
 <circle cx="340" cy="1120" r="20" fill="#1d1d1d"/><text x="340" y="1129" fill="#fff">7</text>
</g>

<!-- Leyenda -->
<line x1="40" y1="1380" x2="1040" y2="1380" stroke="#5a4128" stroke-width="2"/>
<text x="40" y="1428" class="t" font-size="30">QUÉ VER</text>
<g class="s" font-size="25">
 <g transform="translate(40,1482)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">1</text>
  <text x="50" y="0"><tspan font-weight="bold">Terraza del Carciofo:</tspan> dense vuelta, palacio y Duomo.</text></g>
 <g transform="translate(40,1544)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">2</text>
  <text x="50" y="0"><tspan font-weight="bold">Anfiteatro:</tspan> gradas de pasto, obelisco egipcio y</text>
  <text x="50" y="32">pila romana. Acá los Médici hacían sus fiestas.</text></g>
 <g transform="translate(40,1638)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">3</text>
  <text x="50" y="0"><tspan font-weight="bold">Fuente de Neptuno:</tspan> el dios del mar con su tridente.</text></g>
 <g transform="translate(40,1700)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">4</text>
  <text x="50" y="0"><tspan font-weight="bold">Estatua de la Abundancia:</tspan> lo más alto, vista a Florencia.</text></g>
 <g transform="translate(40,1762)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">5</text>
  <text x="50" y="0"><tspan font-weight="bold">Jardín del Caballero:</tspan> rosales y vista a las colinas.</text></g>
 <g transform="translate(40,1824)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">6</text>
  <text x="50" y="0"><tspan font-weight="bold">Gruta de Buontalenti:</tspan> cueva artificial con estalactitas.</text></g>
 <g transform="translate(40,1886)"><circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">7</text>
  <text x="50" y="0"><tspan font-weight="bold">Fuente del Bacco:</tspan> el enano de los Médici en una tortuga.</text></g>
</g>
<text x="40" y="1960" class="s" font-size="21" font-style="italic" fill="#6b5a44">Si cuesta subir: queden en 1 y 2 (casi plano) y vayan directo a 6 y 7.</text>
<text x="40" y="1995" class="s" font-size="21" font-style="italic" fill="#6b5a44">Croquis esquemático, no a escala. Última entrada 15:30 · cierra 16:30.</text>
</svg>
</body></html>
