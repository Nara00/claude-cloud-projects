<!doctype html>
<html><head><meta charset="utf-8"><title>Palazzo Pitti</title>
<style>
body{margin:0;background:#fbf7ee}
svg{display:block}
.t{font-family:"DejaVu Serif",Georgia,serif;font-weight:bold;fill:#3b2a1a}
.s{font-family:"DejaVu Sans",Arial,sans-serif;fill:#3b2a1a}
.room{fill:#f1e4c8;stroke:#5a4128;stroke-width:3}
.hi{fill:#fbe9a6}
.star{fill:#f7d35c}
</style></head><body>
<svg width="1080" height="2160" viewBox="0 0 1080 2160" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
 <pattern id="stone" width="24" height="24" patternUnits="userSpaceOnUse">
  <rect width="24" height="24" fill="#ece5d6"/><path d="M0,24 L24,0" stroke="#d9cfba" stroke-width="2"/></pattern>
 <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse">
  <rect width="30" height="30" fill="#d3e3b5"/><circle cx="8" cy="9" r="3" fill="#b9d18f"/><circle cx="22" cy="22" r="3" fill="#b9d18f"/></pattern>
</defs>

<!-- Título -->
<text x="540" y="62" text-anchor="middle" class="t" font-size="50">PALAZZO PITTI</text>
<text x="540" y="104" text-anchor="middle" class="s" font-size="25">1er piso: Galería Palatina + Apartamentos Reales</text>

<!-- Plaza -->
<rect x="30" y="150" width="62" height="1110" fill="#e6e0d2" stroke="#b8ad96" stroke-width="2"/>
<text transform="translate(70,705) rotate(-90)" text-anchor="middle" class="t" font-size="30" letter-spacing="6">PIAZZA PITTI</text>

<!-- Boboli -->
<rect x="800" y="380" width="250" height="880" fill="url(#grass)" stroke="#7d9a55" stroke-width="3" rx="18"/>
<text transform="translate(935,820) rotate(90)" text-anchor="middle" class="t" font-size="34" fill="#3e5a1e" letter-spacing="4">JARDÍN DE BOBOLI</text>

<text x="925" y="1178" text-anchor="middle" class="s" font-size="21" font-weight="bold">15:30</text>
<text x="925" y="1210" text-anchor="middle" class="s" font-size="19">(cierra 16:30)</text>

<!-- Patio -->
<rect x="360" y="380" width="420" height="640" fill="url(#stone)" stroke="#8a7a60" stroke-width="3"/>
<text x="570" y="660" text-anchor="middle" class="t" font-size="30">PATIO</text>
<text x="570" y="696" text-anchor="middle" class="s" font-size="22">(planta baja)</text>
<text x="570" y="425" text-anchor="middle" class="s" font-size="19">Tesoro de los Grandes Duques</text>
<text x="570" y="450" text-anchor="middle" class="s" font-size="19">(planta baja, desde el patio)</text>
<!-- salida a Boboli -->
<path d="M700,760 L840,760" stroke="#3e5a1e" stroke-width="5" marker-end="url(#ar)" fill="none"/>
<text x="700" y="800" class="s" font-size="19">a Boboli: por el</text>
<text x="700" y="824" class="s" font-size="19">fondo del patio</text>
<!-- entrada -->
<path d="M40,930 L470,930" stroke="#7a6a50" stroke-width="5" stroke-dasharray="10 8" fill="none"/>
<path d="M462,918 L486,930 L462,942 z" fill="#7a6a50"/>
<text x="380" y="975" class="s" font-size="20" font-weight="bold">ENTRADA</text>
<text x="380" y="1000" class="s" font-size="19">y boletería</text>

<!-- Ala norte (1er piso) -->
<rect x="320" y="150" width="144" height="180" class="room hi"/>
<rect x="464" y="150" width="144" height="180" class="room hi"/>
<rect x="608" y="150" width="144" height="180" class="room"/>
<rect x="752" y="150" width="144" height="180" class="room hi"/>
<rect x="896" y="150" width="144" height="180" class="room"/>
<text x="392" y="210" text-anchor="middle" class="t" font-size="24">STUFA</text>
<text x="536" y="200" text-anchor="middle" class="t" font-size="17">EDUCACIÓN</text>
<text x="536" y="224" text-anchor="middle" class="t" font-size="17">DE JÚPITER</text>
<text x="680" y="190" text-anchor="middle" class="s" font-size="17">salas de paso:</text>
<text x="680" y="213" text-anchor="middle" class="s" font-size="17">Ulises · Baño</text>
<text x="680" y="236" text-anchor="middle" class="s" font-size="17">Putti · Flora</text>
<text x="824" y="210" text-anchor="middle" class="t" font-size="19">PROMETEO</text>
<text x="968" y="196" text-anchor="middle" class="t" font-size="20">MÚSICA</text>
<text x="968" y="222" text-anchor="middle" class="s" font-size="17">Galería Poccetti</text>
<!-- inicio -->
<rect x="924" y="340" width="100" height="34" rx="6" fill="#2e7d32"/>
<text x="974" y="364" text-anchor="middle" class="s" font-size="20" font-weight="bold" fill="#fff">INICIO</text>
<text x="974" y="276" text-anchor="middle" class="s" font-size="16">▲ llegan por</text>
<text x="974" y="296" text-anchor="middle" class="s" font-size="16">la escalera</text>

<!-- Fachada (1er piso) -->
<rect x="100" y="150" width="220" height="180" class="room hi"/>
<rect x="100" y="330" width="220" height="120" class="room star"/>
<rect x="100" y="450" width="220" height="110" class="room hi"/>
<rect x="100" y="560" width="220" height="110" class="room hi"/>
<rect x="100" y="670" width="220" height="110" class="room hi"/>
<rect x="100" y="780" width="220" height="110" class="room hi"/>
<rect x="100" y="890" width="220" height="70" class="room"/>
<rect x="100" y="960" width="220" height="300" class="room hi"/>
<line x1="100" y1="1060" x2="320" y2="1060" stroke="#5a4128" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="100" y1="1160" x2="320" y2="1160" stroke="#5a4128" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="180" y="230" text-anchor="middle" class="t" font-size="26">ILÍADA</text>
<text x="150" y="390" class="t" font-size="23">SATURNO</text>
<text x="150" y="420" class="s" font-size="19" font-weight="bold">★ RAFAEL</text>
<text x="150" y="512" class="t" font-size="23">JÚPITER</text>
<text x="150" y="622" class="t" font-size="23">MARTE</text>
<text x="150" y="732" class="t" font-size="23">APOLO</text>
<text x="150" y="842" class="t" font-size="23">VENUS</text>
<text x="180" y="932" text-anchor="middle" class="s" font-size="17">Hornacinas</text>
<text x="170" y="1010" text-anchor="middle" class="t" font-size="17">APARTAMENTOS</text>
<text x="170" y="1036" text-anchor="middle" class="t" font-size="17">REALES</text>
<text x="158" y="1102" class="s" font-size="17">Sala del Trono</text>
<text x="180" y="1215" text-anchor="middle" class="s" font-size="17">Sala Bianca…</text>
<!-- etiqueta planetas -->
<text transform="translate(350,615) rotate(90)" text-anchor="middle" class="s" font-size="18" font-style="italic">— Salas de los Planetas: ¡miren los techos! —</text>

<!-- Recorrido -->
<path d="M1000,305 L896,305 L824,305 L680,305 L536,305 L392,305 L302,305 L302,390 L302,505 L302,615 L302,725 L302,835 L302,925 L302,1010 L302,1100 L302,1230"
 fill="none" stroke="#c0392b" stroke-width="7" stroke-dasharray="16 9" stroke-linejoin="round" marker-mid="url(#ar)" marker-end="url(#ar)"/>
<text x="250" y="1250" text-anchor="middle" class="t" font-size="22" fill="#c0392b">FIN</text>

<g class="s" font-size="24" font-weight="bold" text-anchor="middle">
 <circle cx="824" cy="270" r="20" fill="#1d1d1d"/><text x="824" y="279" fill="#fff">1</text>
 <circle cx="536" cy="270" r="20" fill="#1d1d1d"/><text x="536" y="279" fill="#fff">2</text>
 <circle cx="392" cy="270" r="20" fill="#1d1d1d"/><text x="392" y="279" fill="#fff">3</text>

 <circle cx="124" cy="374" r="18" fill="#1d1d1d"/><text x="124" y="382" fill="#fff" font-size="22">5</text>
 <circle cx="124" cy="496" r="18" fill="#1d1d1d"/><text x="124" y="504" fill="#fff" font-size="22">6</text>
 <circle cx="124" cy="606" r="18" fill="#1d1d1d"/><text x="124" y="614" fill="#fff" font-size="22">7</text>
 <circle cx="124" cy="716" r="18" fill="#1d1d1d"/><text x="124" y="724" fill="#fff" font-size="22">8</text>
 <circle cx="124" cy="826" r="18" fill="#1d1d1d"/><text x="124" y="834" fill="#fff" font-size="22">9</text>
 <circle cx="130" cy="1095" r="20" fill="#1d1d1d"/><text x="130" y="1102" fill="#fff" font-size="19">10</text>
</g>

<!-- Leyenda -->
<line x1="40" y1="1300" x2="1040" y2="1300" stroke="#5a4128" stroke-width="2"/>
<text x="40" y="1348" class="t" font-size="30">QUÉ BUSCAR EN CADA SALA</text>
<g class="s" font-size="25">
 <g transform="translate(40,1400)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">1</text>
  <text x="50" y="0"><tspan font-weight="bold">Prometeo:</tspan> Virgen con el Niño, el cuadro redondo de Filippo Lippi.</text></g>
 <g transform="translate(40,1462)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">2</text>
  <text x="50" y="0"><tspan font-weight="bold">Educación de Júpiter:</tspan> «Amor dormido» de Caravaggio</text>
  <text x="50" y="32">(cuadro chico y oscuro).</text></g>
 <g transform="translate(40,1556)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">3</text>
  <text x="50" y="0"><tspan font-weight="bold">Stufa:</tspan> la sala entera pintada, las Edades del Hombre.</text></g>
 <g transform="translate(40,1618)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">4</text>
  <text x="50" y="0"><tspan font-weight="bold">Ilíada:</tspan> Rafael, «La Gravida» (la embarazada);</text>
  <text x="50" y="32">«Judith» de Artemisia Gentileschi.</text></g>
 <g transform="translate(40,1712)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">5</text>
  <text x="50" y="0"><tspan font-weight="bold">Saturno ★:</tspan> Rafael, Madonna della Seggiola (redonda),</text>
  <text x="50" y="32">Madonna del Granduca y los retratos de los Doni.</text></g>
 <g transform="translate(40,1806)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">6</text>
  <text x="50" y="0"><tspan font-weight="bold">Júpiter:</tspan> Rafael, «La Velata» (miren la manga).</text></g>
 <g transform="translate(40,1868)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">7</text>
  <text x="50" y="0"><tspan font-weight="bold">Marte:</tspan> Rubens, «Consecuencias de la guerra» (grande).</text></g>
 <g transform="translate(40,1930)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">8</text>
  <text x="50" y="0"><tspan font-weight="bold">Apolo:</tspan> Tiziano, Magdalena y «Retrato de caballero».</text></g>
 <g transform="translate(40,1992)">
  <circle cx="18" cy="-8" r="18" fill="#1d1d1d"/><text x="18" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="21">9</text>
  <text x="50" y="0"><tspan font-weight="bold">Venus:</tspan> Venus Itálica de Canova; Tiziano, «La Bella».</text></g>
 <g transform="translate(40,2054)">
  <circle cx="18" cy="-8" r="19" fill="#1d1d1d"/><text x="18" y="-1" text-anchor="middle" fill="#fff" font-weight="bold" font-size="18">10</text>
  <text x="50" y="0"><tspan font-weight="bold">Apartamentos Reales:</tspan> Sala del Trono, Sala Bianca.</text></g>
</g>
<text x="540" y="2120" text-anchor="middle" class="s" font-size="19" font-style="italic" fill="#6b5a44">Croquis esquemático, no a escala. Sigan los carteles «Galleria Palatina».</text>
</svg>
</body></html>
