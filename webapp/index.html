<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a3324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audioguías">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="css/styles.css">
<title>Audioguías</title>
</head>
<body>
<header id="appbar">
  <button id="back" aria-label="Volver" hidden>←</button>
  <h1 id="title">Audioguías</h1>
  <button id="menu" aria-label="Menú">☰</button>
</header>

<main id="root"></main>

<nav id="player" hidden>
  <div class="np-info">
    <div class="np-title" id="np-title"></div>
    <div class="np-sub" id="np-sub"></div>
  </div>
  <div class="np-controls">
    <button id="np-prev" aria-label="Parada anterior" title="Parada anterior">⏮</button>
    <button id="np-back" aria-label="Retroceder 5 segundos" title="−5 s">−5s</button>
    <button id="np-play" aria-label="Reproducir">▶</button>
    <button id="np-fwd" aria-label="Avanzar 5 segundos" title="+5 s">+5s</button>
    <button id="np-next" aria-label="Siguiente parada" title="Siguiente parada">⏭</button>
    <button id="np-rate" aria-label="Velocidad" title="Velocidad">1×</button>
  </div>
  <div class="np-times"><span id="np-cur">0:00</span><input type="range" id="np-seek" min="0" max="100" value="0" step="0.1" aria-label="Posición"><span id="np-dur">0:00</span></div>
  <audio id="audio" preload="metadata"></audio>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="js/app.js" type="module"></script>
</body>
</html>
